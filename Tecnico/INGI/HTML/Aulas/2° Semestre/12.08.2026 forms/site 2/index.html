<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exemplo Botão de Radio e Checkbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
        <h2>Exemplo de Botão de Radio e Checkbox</h2>
        <form>
            <fieldset>
                <legend>Escolha uma opção:</legend>
                <input type="radio" id="opcao1" name="opcoes" value="opcao1">
                <label for="opcao1">Opção 1</label><br>

                <input type="radio" id="opcao2" name="opcoes" value="opcao2">
                <label for="opcao2">Opção 2</label><br>

                <input type="radio" id="opcao3" name="opcoes" value="opcao3">
                <label for="opcao3">Opção 3</label><br>

            </fieldset>

            <fieldset>
                <legend>Marque quantas opções desejar:</legend>
                <input type="checkbox" id="opcao1" name="opcoes2" value="opcao1">
                <label for="opcao1">Opção 1</label><br>

                <input type="checkbox" id="opcao2" name="opcoes2" value="opcao2">
                <label for="opcao2">Opção 2</label><br>

                <input type="checkbox" id="opcao3" name="opcoes2" value="opcao3">
                <label for="opcao3">Opção 3</label><br>

            </fieldset>
            <input type="submit" value="Enviar">
        </form>
    </section>
</body>
</html>
