<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de botão de rádio e checkbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Exemplo de botão de rádio e checkbox</h2>
    <section>
        <fieldset>
            <legend>Escolha suas preferências:</legend>
            <label for="option1">Opção 1</label>
            <input type="radio" id="option1" name="preferences" value="option1">
            <br>
            <label for="option2">Opção 2</label>
            <input type="radio" id="option2" name="preferences" value="option2">
            <br>
            <label for="option3">Opção 3</label>
            <input type="checkbox" id="option3" name="preferences" value="option3">
            <br>
            <label for="option4">Opção 4</label>
            <input type="checkbox" id="option4" name="preferences" value="option4">
            <br><br>
            <input type="submit" value="Enviar">
        </fieldset>
    </section>
</body>
</html>
